version: '3.8'

services:
  # 1. CCTV Video Ingestion Gateway
  webrtc-gateway:
    image: sevasarathi/webrtc-gateway:latest
    container_name: seva_webrtc_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RECORD_STREAM=false

  # 2. AGV Telemetry Broker
  mqtt-broker:
    image: sevasarathi/mqtt-broker:latest
    container_name: seva_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  # 3. AGV ROS 2 Brain & Control Node
  ros2-core:
    image: sevasarathi/ros2-core:latest
    container_name: seva_ros2_core
    restart: always
    network_mode: "host" # Required for DDS multicast discovery across LAN
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - MQTT_HOST=localhost
      - MQTT_PORT=1883

volumes:
  mqtt_data:
  mqtt_log:
