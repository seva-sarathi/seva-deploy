services:

  # 1. WebRTC Video Ingestion Gateway
  webrtc-gateway:
    image: nrgchandra/sevasarathi-webrtc-gateway:latest
    container_name: seva_webrtc_gateway
    restart: always
    command: python -m web.signaling.server
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RECORD_STREAM=false

  # 2. MQTT Telemetry Broker
  mqtt-broker:
    image: nrgchandra/sevasarathi-mqtt-broker:latest
    container_name: seva_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  # 3. AGV ROS 2 Brain & Control Node
  ros2-core:
    image: nrgchandra/ros2-core:latest
    container_name: seva_ros2_core
    restart: always
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - MQTT_HOST=localhost
      - MQTT_PORT=1883

  # 4. Web App Backend Server
  web-server:
    image: nrgchandra/web-app-server:latest
    container_name: seva_web_server
    restart: always
    ports:
      - "5001:5000"

  # 5. Web App Frontend Client
  web-client:
    image: nrgchandra/web-app-client:latest
    container_name: seva_web_client
    restart: always
    ports:
      - "3000:3000"

  postgres-db:
    image: postgres:16-alpine
    container_name: seva_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1608
      POSTGRES_DB: udemydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mqtt_data:
  mqtt_log:
  postgres_data:
