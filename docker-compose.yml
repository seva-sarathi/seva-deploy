version: '3.8'

services:
  webrtc-gateway:
    image: nrgchandra/sevasarathi-webrtc-gateway:latest
    container_name: seva_webrtc_gateway
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RECORD_STREAM=false

  mqtt-broker:
    image: nrgchandra/sevasarathi-mqtt-broker:latest
    container_name: seva_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  postgres:
    image: postgres:17-alpine
    container_name: seva_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sevasarathi
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seva_redis
    restart: always
    ports:
      - "6379:6379"

  ros2-core:
    image: nrgchandra/ros2-core:latest
    container_name: seva_ros2_core
    restart: always
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
    depends_on:
      - mqtt-broker

  web-server:
    image: nrgchandra/web-app-server:latest
    container_name: seva_web_server
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sevasarathi
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_key_123
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

  web-client:
    image: nrgchandra/web-app-client:latest
    container_name: seva_web_client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - web-server

volumes:
  mqtt_data:
  mqtt_log:
  postgres_data:
